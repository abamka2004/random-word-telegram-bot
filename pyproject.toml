[project]
name = "random-word"
version = "0.3.3"
description = "Telegram bot that sends random word every day"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.22.0",
    "aiosqlite>=0.21.0",
    "apscheduler>=3.11.0",
    "emoji>=2.14.1",
    "httpx[socks]>=0.28.1",
    "openai>=2.26.0",
    "pillow>=11.3.0",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.43",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ruff>=0.16.2",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "recommended"
pythonVersion = "3.13"
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportAny = false

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
